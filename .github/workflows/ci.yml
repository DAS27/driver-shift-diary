name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal web/*.go)"
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/diary ./cmd/server
      - name: Docker build
        run: docker build -t driver-shift-diary:test .
